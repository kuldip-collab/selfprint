<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Self Print</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6ff;--card:#fff;--tx:#14163a;--mu:#6b6f95;--pr:#5b4bff;--pr2:#00c2ff;--ok:#12b76a;--wa:#f79009;--bd:#e3e6fb}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f24;--card:#171a3a;--tx:#eef0ff;--mu:#9a9fcb;--bd:#272b57}}
:root[data-theme="dark"]{--bg:#0d0f24;--card:#171a3a;--tx:#eef0ff;--mu:#9a9fcb;--bd:#272b57}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Devanagari",sans-serif;line-height:1.5}
.wrap{max-width:1000px;margin:auto;padding:0 16px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.nav{display:flex;align-items:center;gap:8px;padding:10px 0;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;display:flex;gap:8px;align-items:center;margin-right:auto}
.logo i{font-style:normal;background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border-radius:10px;padding:2px 8px}
.tabs{display:flex;gap:4px;overflow-x:auto;max-width:100%}
.tabs button,.lang{border:0;background:transparent;color:var(--tx);padding:8px 12px;border-radius:999px;font-weight:600;cursor:pointer;white-space:nowrap;font-size:14px}
.tabs button.on{background:var(--pr);color:#fff}
.lang{border:1px solid var(--bd);background:var(--card)}
.hero{background:linear-gradient(135deg,#5b4bff,#00c2ff);color:#fff;border-radius:24px;margin:18px 0;padding:36px 24px;position:relative;overflow:hidden}
.hero:after{content:"🖨️";position:absolute;right:14px;bottom:-14px;font-size:120px;opacity:.18}
.hero h1{margin:0 0 8px;font-size:clamp(26px,6vw,42px);line-height:1.15}
.hero p{margin:0 0 18px;max-width:520px;opacity:.95}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:700;font-size:15px;cursor:pointer;background:var(--pr);color:#fff}
.btn.w{background:#fff;color:var(--pr)}.btn.g{background:var(--ok)}.btn.o{background:var(--wa)}.btn.l{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;box-shadow:0 6px 20px rgba(60,60,160,.06)}
.card h3{margin:6px 0}.card p{margin:0;color:var(--mu);font-size:14px}
.ic{font-size:30px}
h2{margin:26px 0 12px}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px;color:var(--mu)}
input,select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px}
.drop{border:2px dashed var(--pr);border-radius:16px;padding:26px;text-align:center;cursor:pointer;background:color-mix(in srgb,var(--pr) 6%,transparent)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bill{background:linear-gradient(135deg,#14163a,#2a2670);color:#fff;border-radius:16px;padding:16px;margin-top:14px}
.bill b{font-size:28px}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.pay div{border:2px solid var(--bd);border-radius:12px;padding:12px;text-align:center;cursor:pointer;font-weight:600}
.pay div.on{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 10%,transparent)}
.tag{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;color:#fff}
.s0{background:var(--wa)}.s1{background:var(--pr)}.s2{background:var(--ok)}.s3{background:#999}
.ord{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd);padding:12px 0}
.ord:last-child{border:0}
.steps{display:flex;gap:6px;margin:14px 0}.steps div{flex:1;height:8px;border-radius:9px;background:var(--bd)}.steps div.on{background:var(--ok)}
.pg{display:none}.pg.on{display:block}
.ok{background:color-mix(in srgb,var(--ok) 12%,transparent);border:1px solid var(--ok);border-radius:14px;padding:14px;margin-top:14px}
.poster{max-width:380px;margin:auto;text-align:center;background:linear-gradient(160deg,#5b4bff,#00c2ff);color:#fff;border-radius:22px;padding:26px}
.poster #qr{background:#fff;display:inline-block;padding:12px;border-radius:14px;margin:12px 0}
.poster h2{margin:0;font-size:30px}body{background:linear-gradient(160deg,#ffe3f1 0%,#e7e9ff 45%,#d9f7ff 100%) fixed}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background:linear-gradient(160deg,#1d1040,#0d0f24 50%,#06263a) fixed}}:root[data-theme="dark"] body{background:linear-gradient(160deg,#1d1040,#0d0f24 50%,#06263a) fixed}.card{--a:var(--pr);background:linear-gradient(145deg,color-mix(in srgb,var(--a) 15%,var(--card)),color-mix(in srgb,var(--a) 4%,var(--card)));border:1px solid color-mix(in srgb,var(--a) 30%,var(--bd));border-top:5px solid var(--a)}.grid>.card:nth-child(6n+1){--a:#ff4d8d}.grid>.card:nth-child(6n+2){--a:#ff9f1c}.grid>.card:nth-child(6n+3){--a:#12b76a}.grid>.card:nth-child(6n+4){--a:#00b4d8}.grid>.card:nth-child(6n+5){--a:#7c4dff}.grid>.card:nth-child(6n+6){--a:#ef4444}.ic{display:inline-flex;width:52px;height:52px;align-items:center;justify-content:center;border-radius:16px;background:color-mix(in srgb,var(--a) 22%,transparent)}.hero{background:linear-gradient(135deg,#ff4d8d,#7c4dff 50%,#00c2ff)}.tabs button.on{background:linear-gradient(135deg,#ff4d8d,#7c4dff)}.btn{background:linear-gradient(135deg,#7c4dff,#ff4d8d)}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:10px 0}.stt{border-radius:16px;padding:14px;color:#fff;text-align:center;font-weight:600}.stt b{font-size:26px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;text-align:left;border-bottom:1px solid var(--bd)}th{color:var(--mu)}.sw{display:flex;justify-content:space-between;align-items:center;font-size:16px;color:var(--tx);margin:12px 0}.sw input{appearance:none;-webkit-appearance:none;width:50px;height:28px;border-radius:99px;background:#b8b8c8;position:relative;padding:0;border:0;cursor:pointer;transition:.2s}.sw input:checked{background:var(--ok)}.sw input:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}.sw input:checked:after{left:25px}.card{background:linear-gradient(145deg,color-mix(in srgb,var(--a) 28%,var(--card)),color-mix(in srgb,var(--a) 9%,var(--card)))}input,select{background:color-mix(in srgb,var(--a,var(--pr)) 9%,var(--card));border:1.5px solid color-mix(in srgb,var(--a,var(--pr)) 35%,var(--bd))}header{background:linear-gradient(90deg,rgba(255,77,141,.25),rgba(124,77,255,.25),rgba(0,194,255,.25))}main>section>h2{background:linear-gradient(90deg,#ff4d8d,#7c4dff,#00b4d8);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}.drop{background:color-mix(in srgb,var(--a) 14%,var(--card));border-color:var(--a)}#pc{border-color:#ff9f1c}#po{border-color:#12b76a}#pc.on{background:#fff1d6;color:#7a4a00}#po.on{background:#d9f7e8;color:#0a5c36}.pay div{background:var(--card)}.ord{border:1px solid color-mix(in srgb,var(--a) 25%,transparent)!important;border-radius:12px;padding:10px 12px;margin:6px 0;background:color-mix(in srgb,var(--a) 8%,var(--card))}th{background:color-mix(in srgb,var(--a) 20%,transparent);color:var(--tx)}.pm{display:flex;gap:8px;flex-wrap:wrap}.ck{display:flex;align-items:center;gap:8px;margin:0;padding:8px 12px;border-radius:12px;background:var(--card);border:2px solid var(--bd);font-size:14px;font-weight:700;color:var(--tx);cursor:pointer}.ck input{appearance:auto;-webkit-appearance:checkbox;width:20px;height:20px;padding:0;accent-color:#12b76a;border-radius:4px}.thumbs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}.th{position:relative}.th img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:2px solid var(--a);margin:0}.th button{position:absolute;right:-6px;bottom:-6px;border:0;border-radius:50%;width:26px;height:26px;background:var(--pr);color:#fff;cursor:pointer}#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(30px);background:#14163a;color:#fff;padding:12px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:120;font-weight:600;max-width:90%;text-align:center}#toast.on{opacity:1;transform:translateX(-50%)}input[type=range]{padding:0;border:0;background:none;accent-color:var(--pr);height:28px}#prev canvas{max-height:none;height:auto;width:100%;max-width:440px}.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:430px;overflow:auto;padding:4px}.pt{position:relative;border:3px solid var(--bd);border-radius:10px;overflow:hidden;opacity:.45;cursor:pointer;background:#fff}.pt.on{border-color:var(--ok);opacity:1}#prev .pt canvas{margin:0;border:0;border-radius:0}.pt b{position:absolute;left:4px;top:4px;background:#14163a;color:#fff;border-radius:8px;padding:0 7px;font-size:12px}.pt.on b{background:var(--ok)}.pt .zm{position:absolute;right:4px;bottom:4px;background:#fff;border-radius:50%;width:26px;height:26px;line-height:26px;font-size:14px;box-shadow:0 1px 4px rgba(0,0,0,.3)}.pdfbar{display:grid;grid-template-columns:1fr auto auto;gap:6px;margin:8px 0}.pdfbar .btn{padding:8px 12px}.op{display:flex;gap:8px;overflow-x:auto;padding-top:8px}.op img{height:150px;width:auto;border-radius:10px;border:2px solid var(--a,var(--pr));background:#fff;cursor:zoom-in;flex:none}.prev{margin-top:12px;text-align:center}.prev img,.prev canvas{max-width:100%;max-height:340px;border-radius:12px;border:1px solid var(--bd);background:#fff;margin:4px}.prev iframe{width:100%;height:340px;border:1px solid var(--bd);border-radius:12px}
footer{text-align:center;color:var(--mu);padding:28px 0;font-size:13px}
#pa{display:none}@page{size:A4;margin:0}@media print{body{background:#fff!important}body.pp-docs>*:not(#pa){display:none!important}body.pp-docs #pa{display:block}#pa img{width:100%;display:block;page-break-after:always}body.pp-poster>*:not(main){display:none!important}body.pp-poster main>section:not(#p-qr){display:none!important}body.pp-poster #p-qr{display:block!important}body.pp-poster #p-qr>*:not(.poster){display:none!important}}
</style>
</head>
<body>
<header><div class="wrap nav">
<div class="logo"><i>SP</i> Self Print <img id="shoplogo" alt="" style="display:none;height:28px;border-radius:8px"><small id="shopname" style="font-weight:600;font-size:13px"></small></div>
<div class="tabs" id="tabs"></div>
<button class="lang" id="lang">English</button>
</div></header>

<main class="wrap">
<section class="pg on" id="p-home">
<div class="hero"><h1 data-t="h1"></h1><p data-t="h1p"></p><button class="btn w" onclick="go('cust')" data-t="start"></button></div>
<div class="grid">
<div class="card"><div class="ic">📤</div><h3 data-t="f1"></h3><p data-t="f1p"></p></div>
<div class="card"><div class="ic">🧾</div><h3 data-t="f2"></h3><p data-t="f2p"></p></div>
<div class="card"><div class="ic">🏪</div><h3 data-t="f3"></h3><p data-t="f3p"></p></div>
<div class="card"><div class="ic">📱</div><h3 data-t="f4"></h3><p data-t="f4p"></p></div>
<div class="card"><div class="ic">💳</div><h3 data-t="f5"></h3><p data-t="f5p"></p></div>
<div class="card"><div class="ic">🌐</div><h3 data-t="f6"></h3><p data-t="f6p"></p></div>
</div>
</section>

<section class="pg" id="p-cust">
<h2 data-t="t_cust"></h2><div id="expbar" class="ok" style="display:none;border-color:#ef4444;background:rgba(239,68,68,.12)"></div>
<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(290px,1fr))">
<div class="card">
<div class="drop" style="position:relative"><div class="ic">📄</div><b id="fname" data-t="drop"></b><p data-t="dropp"></p><input type="file" id="f" accept="application/pdf,image/*" multiple style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0;border:0"></div>

<div class="row"><div><label data-t="mode"></label><select id="md"><option value="doc" data-t="mdoc"></option><option value="col" data-t="mcol"></option><option value="id" data-t="mid"></option></select></div><div id="perw" style="display:none"><label data-t="per"></label><select id="per"><option value="2">2</option><option value="4" selected>4</option><option value="6">6</option></select></div></div><div id="idc" style="display:none"><p style="font-size:13px;color:var(--mu);margin:8px 0 0" data-t="idh"></p><label><span data-t="isz"></span>: <b id="iwv">8.6</b> cm</label><input type="range" id="iw" min="5" max="14" step="0.1" value="8.6"><label><span data-t="itp"></span>: <b id="itv">3</b> cm</label><input type="range" id="it" min="0.5" max="20" step="0.1" value="3"><label><span data-t="igp"></span>: <b id="igv">1.5</b> cm</label><input type="range" id="ig" min="0" max="8" step="0.1" value="1.5"><label><span data-t="ixp"></span>: <b id="ixv">0</b> cm</label><input type="range" id="ix" min="-6" max="6" step="0.1" value="0"><div class="row" style="margin-top:8px"><label class="ck"><input type="checkbox" id="ib" checked><span data-t="ibd"></span></label><button class="btn l" onclick="idSwap()" data-t="swap"></button></div><button class="btn l" style="margin-top:8px;width:100%" onclick="idO=[[0,0],[0,0]];drawId()" data-t="rst"></button></div>
<div class="prev" id="prev"></div>
<div class="row"><div><label data-t="pages"></label><input id="pg" type="number" min="1" value="1"></div><div><label data-t="copies"></label><input id="cc" type="number" min="1" value="1"></div></div>
<div class="row"><div><label data-t="color"></label><select id="col"><option value="bw" data-t="bw"></option><option value="cl" data-t="cl"></option></select></div><div><label data-t="side"></label><select id="sd"><option value="1" data-t="s1x"></option><option value="2" data-t="s2x"></option></select></div></div>
</div>
<div class="card">
<h3 data-t="est"></h3>
<div class="bill"><span data-t="total"></span><br><b id="amt">₹0</b><div id="det" style="font-size:13px;opacity:.8"></div></div>
<label data-t="payq"></label>
<div class="pay"><div id="pc" onclick="setPay('cash')" class="on">💵 <span data-t="cash"></span></div><div id="po" onclick="setPay('online')">📲 <span data-t="online"></span></div></div>
<p id="payn" style="font-size:13px;color:var(--mu)"></p>
<button class="btn" style="width:100%" onclick="place()" data-t="place"></button>
<div id="done"></div>
</div>
</div>
</section>

<section class="pg" id="p-track">
<h2 data-t="t_track"></h2>
<div class="card"><label data-t="oid"></label><div class="row" style="grid-template-columns:1fr auto"><input id="tid" placeholder="SP-1001"><button class="btn" onclick="track()" data-t="find"></button></div><div id="tres"></div></div>
</section>

<section class="pg" id="p-own">
<h2 data-t="t_own"></h2>
<div class="card" id="gate" style="max-width:380px;margin:auto"><h3 data-t="login"></h3><p style="font-size:13px;color:var(--mu)" data-t="gh"></p><label data-t="idl"></label><input id="gs" autocapitalize="none" autocomplete="username"><label data-t="pin"></label><input id="gp" type="password" maxlength="64" autocomplete="current-password"><button class="btn" style="width:100%;margin-top:14px" onclick="login()" data-t="enter"></button><button class="btn l" style="width:100%;margin-top:8px" onclick="forgot()" data-t="forgot"></button><p id="gm" style="color:#d92d20;font-size:13px"></p></div>
<div class="grid" id="dash" style="display:none;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))">
<div class="card noprint" id="subbar" style="grid-column:1/-1;--a:#12b76a"></div>
<div class="card noprint" style="grid-column:1/-1;--a:#7c4dff"><h3 data-t="daywise"></h3><div class="stats" id="stats"></div><div style="overflow-x:auto"><table id="dtab"></table></div></div>
<div class="card noprint" style="--a:#12b76a;padding:12px 16px"><h3 style="margin:0 0 8px;font-size:16px" data-t="payset"></h3><div class="pm"><label class="ck"><input type="checkbox" id="to" onchange="savePay()"><span>📲 <span data-t="online"></span></span></label><label class="ck"><input type="checkbox" id="tc" onchange="savePay()"><span>💵 <span data-t="cash"></span></span></label></div></div>
<div class="card noprint" style="--a:#00b4d8"><h3 data-t="adel"></h3><p style="font-size:13px;color:var(--mu);margin:0 0 8px" data-t="adelh"></p><select id="adm_sel" onchange="saveAdel()"><option value="5">5</option><option value="10">10</option><option value="15">15</option></select></div>
<div class="card noprint" style="--a:#7c4dff"><h3 data-t="prn"></h3><div id="prlist"></div><div class="row"><div><label data-t="prname"></label><input id="prn1" placeholder="HP LaserJet"></div><div><label data-t="prmodel"></label><input id="prm1" placeholder="M1136"></div></div><button class="btn g" style="margin-top:8px" onclick="addPr()" data-t="add"></button><p style="font-size:12px;color:var(--mu)" data-t="prnote"></p></div>
<div class="card noprint" style="grid-column:span 2;--a:#ff9f1c"><h3 data-t="orders"></h3><label class="ck" style="margin-bottom:8px"><input type="checkbox" id="ap" checked><span data-t="autop"></span></label><div id="olist"></div></div>
<div class="card noprint"><h3 data-t="prices"></h3>
<label data-t="pbw"></label><input id="pbw" type="number" step="0.5">
<label data-t="pcl"></label><input id="pcl" type="number" step="0.5">
<label data-t="pdisc"></label><input id="pdd" type="number" step="0.5">
<button class="btn g" style="margin-top:12px;width:100%" onclick="savePrice()" data-t="save"></button></div>
</div>
</section>

<section id="p-qr" style="display:none"><h2 data-t="t_qr"></h2>
<div class="card" style="--a:#ff4d8d;margin-bottom:14px"><label data-t="shop"></label><input id="shop"><label data-t="url"></label><input id="qurl" readonly>
<label data-t="logo"></label><div class="row"><input type="file" id="lg" accept="image/*"><button class="btn l" onclick="rmLogo()" data-t="rmlogo"></button></div>
<label data-t="theme"></label><select id="th1" onchange="mkQR()"><option value="0" data-t="th0"></option><option value="1" data-t="th1t"></option><option value="2" data-t="th2"></option><option value="3" data-t="th3"></option></select>
<div class="row" style="margin-top:12px"><button class="btn" onclick="mkQR()" data-t="gen"></button><button class="btn g" onclick="dlPoster()" data-t="dlp"></button></div>
<div class="row" style="margin-top:8px"><button class="btn l" onclick="printPoster()" data-t="pp"></button><button class="btn l" onclick="logout()" data-t="out"></button></div></div>
<div id="pprev" style="text-align:center"></div></section>
<section class="pg" id="p-adm"><h2 data-t="t_adm"></h2>
<div class="card" id="rcv" style="display:none;max-width:380px;margin:auto;--a:#12b76a"><h3 data-t="rtitle"></h3><label data-t="nwp"></label><input id="nw1" type="password" autocomplete="new-password"><label data-t="nwp2"></label><input id="nw2" type="password" autocomplete="new-password"><button class="btn g" style="width:100%;margin-top:14px" onclick="setNewPw()" data-t="save"></button><p id="rm" style="color:#d92d20;font-size:13px"></p></div>
<div class="card" id="agate" style="max-width:380px;margin:auto"><h3 data-t="alogin"></h3><label data-t="aemail"></label><input id="ae" type="email" autocapitalize="none" autocomplete="username"><label data-t="pin"></label><input id="apw" type="password" autocomplete="current-password"><button class="btn" style="width:100%;margin-top:14px" onclick="adminLogin()" data-t="enter"></button><button class="btn l" style="width:100%;margin-top:8px" onclick="adminForgot()" data-t="aforgot"></button><p style="font-size:12px;color:var(--mu)" data-t="ahint"></p><p id="am" style="color:#d92d20;font-size:13px"></p></div>
<div id="adash" style="display:none"><div class="stats" id="astats"></div><div class="stats" id="sstats"></div>
<div class="card" style="--a:#7c4dff;margin-top:12px"><h3 data-t="addshop"></h3><div class="row"><div><label data-t="sname"></label><input id="anm"></div><div><label data-t="sslug"></label><input id="asl" autocapitalize="none" placeholder="dukan1"></div></div><p style="font-size:13px;color:var(--mu)" data-t="addhint"></p><button class="btn g" onclick="addShop()" data-t="add"></button> <button class="btn l" onclick="adminOut()" data-t="out"></button><p id="adm_msg" style="font-size:13px"></p></div>

async function toPages(files,color){const out=[],W=1240,H=1754;
const put=(src,sw,sh)=>{const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,W,H);if(!color)x.filter="grayscale(1)";const k=Math.min(W/sw,H/sh);x.drawImage(src,(W-sw*k)/2,(H-sh*k)/2,sw*k,sh*k);return c.toDataURL("image/jpeg",.92)};
for(const f of files){if(f.b.type=="application/pdf"&&window.pdfjsLib){const d=await pdfjsLib.getDocument({data:await f.b.arrayBuffer()}).promise;for(let n=1;n<=Math.min(d.numPages,200);n++){const p=await d.getPage(n),v=p.getViewport({scale:1}),vp=p.getViewport({scale:Math.min(2.5,1240/v.width)}),c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;await p.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;out.push(put(c,c.width,c.height))}}
else if(f.b.type.startsWith("image/")){const i=await ld(f.b);out.push(put(i,i.width,i.height))}}return out}
async function printOrder(o){const f=await getFiles(o);if(!f.length){say(T[L].nofiles);return false}
const pages=await toPages(f,o.color),h=[];for(let c=0;c<o.copies;c++)pages.forEach(u=>h.push(`<img src="${u}">`));
$("pa").innerHTML=h.join("");await Promise.all([...$("pa").querySelectorAll("img")].map(i=>i.decode().catch(()=>{})));
document.body.classList.add("pp-docs");window.print();document.body.classList.remove("pp-docs");$("pa").innerHTML="";return true}
async function autoPrint(){if(printing||!$("ap")||!$("ap").checked)return;const o=ords.find(x=>x.status=="printing"&&!prDone.includes(x.id)&&!x.files_deleted);if(!o)return;printing=true;
try{if(await printOrder(o)){prDone.push(o.id);try{localStorage.setItem("sp_pr",JSON.stringify(prDone.slice(-300)))}catch(e){}await ch(o.id,"printed")}else prDone.push(o.id)}catch(e){}printing=false}
async function manPrint(id){const o=ords.find(x=>x.id==id);if(o&&!printing){printing=true;try{await printOrder(o);if(o.status=="printing")await ch(id,"printed")}catch(e){}printing=false}}


async function adminLogin(){const {error}=await sb.auth.signInWithPassword({email:$("ae").value.trim().toLowerCase(),password:$("apw").value});if(error){$("am").textContent=T[L].wrong+" ["+error.message+"]";return}
const {data:ok}=await sb.rpc("is_admin");if(!ok){$("am").textContent=T[L].notadm;await sb.auth.signOut();return}$("am").textContent="";$("apw").value="";admin=true;agate();loadAdmin();clearInterval(pollA);pollA=setInterval(loadAdmin,30000)}
async function adminOut(){clearInterval(pollA);admin=false;await sb.auth.signOut();agate()}

function renderAdmin(){const t=T[L],td=today(),by={};ordsA.forEach(o=>{const r=by[o.shop_id]||(by[o.shop_id]={n:0,p:0,q:0,a:0,tn:0});r.n++;if(dkey(o.created_at)==td)r.tn++;if(o.status=="printing"||o.status=="printed"){r.p++;r.a+=+o.amount}else if(o.status=="pending"||o.status=="awaiting_payment")r.q++});
const tot=Object.values(by).reduce((s,r)=>({n:s.n+r.n,p:s.p+r.p,q:s.q+r.q,a:s.a+r.a,tn:s.tn+r.tn}),{n:0,p:0,q:0,a:0,tn:0});
$("astats").innerHTML=[[t.shops,shopsA.length,"#7c4dff,#00b4d8"],[t.tn,tot.tn,"#ff9f1c,#ff4d4d"],[t.tp,tot.p,"#12b76a,#00c2a8"],[t.ta,"₹"+tot.a,"#ff4d8d,#ff9f1c"]].map(x=>`<div class="stt" style="background:linear-gradient(135deg,${x[2]})"><b>${x[1]}</b><br>${x[0]}</div>`).join("");
$("shops").innerHTML=shopsA.map(s=>{const r=by[s.id]||{n:0,p:0,q:0,a:0,tn:0},link=base()+"?shop="+s.slug;return `<div class="card" style="--a:${!s.active||daysLeft(s.paid_until)<0?"#ef4444":daysLeft(s.paid_until)<=7?"#ff9f1c":"#12b76a"};margin-top:12px"><h3>${esc(s.name)} <small>(${esc(s.slug)})</small></h3><p>💳 ${esc(s.plan||"-")} • ${daysLeft(s.paid_until)<0?t.subexp:t.subleft.replace("{d}",daysLeft(s.paid_until))} • ${new Date(s.paid_until).toLocaleDateString("en-GB")}</p>${s.reset_requested?`<span class="tag s0">🔑 ${t.rreq}</span>`:""}<p>${t.tn}: ${r.tn} • ${t.tp}: ${r.p} • ${t.tq}: ${r.q} • ${t.ta}: ₹${r.a}</p><p style="word-break:break-all;font-size:13px">${esc(link)}</p><div style="margin:8px 0">${[1,3,6,12].map(m=>`<button class="btn g" style="padding:8px 12px;margin:2px" onclick="renew('${esc(s.slug)}',${m})">+${m} ${t.mon}</button>`).join("")}</div><button class="btn l" onclick="cp('${esc(link)}')">${t.copy}</button> <button class="btn ${s.active?"o":"g"}" onclick="setAct('${esc(s.slug)}',${!s.active})">${s.active?t.off:t.on_}</button> <button class="btn l" onclick="resetPw('${esc(s.slug)}')">🔑 ${t.rpw}</button></div>`}).join("")}
async function cp(x){try{await navigator.clipboard.writeText(x);say("✔ Copied")}catch(e){say(x)}}
async function setAct(slug,b){const {error}=await sb.rpc("admin_set_active",{p_slug:slug,p_active:b});if(error)say(error.message);else loadAdmin()}
async function addShop(){const slug=$("asl").value.trim().toLowerCase(),name=$("anm").value.trim();if(!/^[a-z0-9-]{3,30}$/.test(slug)||!name){$("adm_msg").textContent=T[L].badslug;return}
const {error}=await sb.rpc("admin_add_shop",{p_slug:slug,p_name:name,p_login:slug});$("adm_msg").textContent=error?error.message:"✔ "+T[L].added;if(!error){$("asl").value="";$("anm").value="";loadAdmin()}}

ui();go(REC?"adm":SHOP?"cust":"home");loadShop();if(!REC)restore();agate();if(/error_code/.test(location.hash))say(T[L].rcverr);
</script>
